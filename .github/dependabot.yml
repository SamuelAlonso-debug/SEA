version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    target-branch: stage
    schedule:
      interval: weekly
    # Majors que exigen migración propia (TS 7 rompe ts-node-dev). @types/node sigue al runtime (Node 22).
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, javascript, "type:chore", "area:backend"]
    assignees: [SamuelAlonso-debug]
    milestone: 3
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /apps/web
    target-branch: stage
    schedule:
      interval: weekly
    # Majors que exigen migración propia. @types/node sigue al runtime (Node 22).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, javascript, "type:chore", "area:frontend"]
    assignees: [SamuelAlonso-debug]
    milestone: 3
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    target-branch: stage
    schedule:
      interval: weekly
    labels: [dependencies, github_actions, "type:chore", "area:ci-cd"]
    assignees: [SamuelAlonso-debug]
    milestone: 3
    commit-message:
      prefix: ci
