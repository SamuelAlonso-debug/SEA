name: Backup restore test

# Prueba extremo a extremo de los scripts de respaldo con Mongo efímeras y almacenamiento local.
# No usa cuentas ni secretos: la llave age se genera en cada corrida.
on:
  pull_request:
    paths: [deploy/backup/**, .github/workflows/backup-restore.yml]
  push:
    branches: [stage]
    paths: [deploy/backup/**, .github/workflows/backup-restore.yml]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-test:
    name: Backup restore test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sea-backup deploy/backup
      - name: Mongo efímeras y listener de alertas
        run: |
          docker run -d --name src --network host mongo:7 --port 27017
          docker run -d --name dst --network host mongo:7 --port 27018
          mkdir -p "$RUNNER_TEMP/alerts"
          nohup python3 -c '
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers["Content-Length"]))
                  open("'"$RUNNER_TEMP"'/alerts/alert.txt", "ab").write(body)
                  self.send_response(200); self.end_headers()
          http.server.HTTPServer(("127.0.0.1", 8080), H).serve_forever()' >/dev/null 2>&1 &
          for p in 27017 27018; do
            for _ in $(seq 30); do docker run --rm --network host mongo:7 mongosh --port $p --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break; sleep 2; done
          done
      - name: Respaldo, retención, cifrado, restauración y alerta
        run: |
          docker run --rm --network host -v "$RUNNER_TEMP/alerts:/alerts" \
            -e SOURCE_URI=mongodb://127.0.0.1:27017/sea -e RESTORE_URI=mongodb://127.0.0.1:27018/sea \
            -e ALERT_URL=http://127.0.0.1:8080/ -e ALERT_FILE=/alerts/alert.txt \
            sea-backup /opt/backup/test.sh
